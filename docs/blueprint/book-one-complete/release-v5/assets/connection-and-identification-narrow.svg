<title id="connection-and-identification-title">Connection and identification</title>
<desc id="connection-and-identification-desc">Two panels show the same living body connected to the same Canvas and Little c. In the first, the thought is I am this reaction. In the second, it is I notice this reaction. The body remains visible and the arrows stay intact in both; no physical or functional connection is cut.</desc>
