<text id="fear-and-choice-text-12" data-fit-box="27,575,323,920" x="168" y="797" fill="#18382f" font-family="&#x27;Space Grotesk&#x27;, &#x27;Space Grotesk Light&#x27;, &#x27;DejaVu Sans&#x27;, sans-serif" font-size="18" font-weight="600" text-anchor="start">
