<text id="fear-and-choice-text-13" data-fit-box="27,575,323,920" x="168" y="862" fill="#18382f" font-family="&#x27;Space Grotesk&#x27;, &#x27;Space Grotesk Light&#x27;, &#x27;DejaVu Sans&#x27;, sans-serif" font-size="18" font-weight="600" text-anchor="start">
<tspan x="168" dy="0">Protect</tspan>
</text>
<text id="fear-and-choice-text-14" data-fit-box="5,5,345,1075" x="175" y="1001" fill="#18382f" font-family="&#x27;Source Serif 4 SmText&#x27;, &#x27;Source Serif 4&#x27;, Georgia, serif" font-size="16" font-weight="400" text-anchor="middle">
<tspan x="175" dy="0">A wider field can still include</tspan>
<tspan x="175" dy="20.48">protection and a clear no.</tspan>
