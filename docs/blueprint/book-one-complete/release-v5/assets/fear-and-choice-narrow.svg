<text id="fear-and-choice-text-15" data-fit-box="5,5,345,1075" x="175" y="1056" fill="#536b60" font-family="&#x27;Space Grotesk&#x27;, &#x27;Space Grotesk Light&#x27;, &#x27;DejaVu Sans&#x27;, sans-serif" font-size="14" font-weight="400" text-anchor="middle">
