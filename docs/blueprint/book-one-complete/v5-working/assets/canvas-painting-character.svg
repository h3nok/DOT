<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="canvas-painting-character-title canvas-painting-character-desc">
<title id="canvas-painting-character-title">Three roles in a changing life</title>
<desc id="canvas-painting-character-desc">Three panels repeat one visual motif. The first highlights the Canvas boundary as the capacity that carries state. The second highlights the accumulated strokes inside it as the Painting. The third shows repeated embodied actions as Character. The Canvas is not identical to its Painting, and neither is identical to Little c.</desc>
