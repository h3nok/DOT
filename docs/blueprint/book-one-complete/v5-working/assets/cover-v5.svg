<title id="cover-title">Consciousness: A Digital Organism · Version 5</title>
<desc id="cover-description">Cover of Consciousness: A Digital Organism, Book One, by Henok Ghebrechristos. The theory diagram places T × E, explicitly labelled Speculation, outside Big C, the proposed conscious process. RF₀ and Little c are both within Big C. Little c is outside RF₀ and receives its Reality Stream. The living Avatar embodies Little c in RF₀. Little c, the Canvas and the Avatar remain distinct and connected. Broken arrows around Big C and Little c indicate process. Version 5, author review.</desc>
