<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 900 940" role="img" aria-labelledby="little-c-scope-title little-c-scope-desc">
<title id="little-c-scope-title">Little c and local scope</title>
<desc id="little-c-scope-desc">Big C encloses RF zero and a separate local field of participation. RF zero contains the living Avatar and supplies a Reality Stream to Little c outside RF zero. Little c connects to the Canvas within a dashed field labelled local scope. Three lines state what can become more available as carried state changes: noticed distinctions, possible responses, and considered action. The local self-aware process keeps the same nature; scope describes access and participation, not size or rank.</desc>
