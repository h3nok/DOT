<title id="avatar-canvas-title">An embodied exchange</title>
<desc id="avatar-canvas-desc">A living human Avatar exchanges experience and response with the Canvas. The Canvas carries an accumulated Painting. Little c, the local experiencer, remains distinct and is linked to the Canvas by access and update. The same roles are shown without placing consciousness at a measured physical location.</desc>
