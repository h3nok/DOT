<svg xmlns="http://www.w3.org/2000/svg" width="350" height="1220" viewBox="0 0 350 1220" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">The proposed architecture</title>
<desc id="architecture-desc">T × E, labelled Speculation, sits outside Big C and names its preexisting conditions. A large Big C enclosure contains an RF zero enclosure with the living Avatar, plus Little c and a Canvas outside RF zero. A one-way arrow labelled RS, Reality Stream, runs from RF zero to Little c. Little c exchanges access and update with the Canvas. Dashed arrows indicate continuing process. All shapes describe DOT’s proposed relationships, not measured locations.</desc>
