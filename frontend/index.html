<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon-dot.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dot.svg" />
    <link rel="apple-touch-icon" href="/favicon-dot.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOT — Digital Organism Theory</title>
    <meta
      name="description"
      content="Digital Organism Theory: a framework for consciousness, conditioning, and conscious authorship. Read the line-edited Book One and explore its source-derived concept map."
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Restore the real URL after 404.html folded it into a query string, so a
         shared or reloaded chapter link lands on the chapter. Must run before
         the app boots and reads the location. -->
    <script>
      (function (l) {
        if (l.search[1] !== "/") return;
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (part) {
            return part.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash,
        );
      })(window.location);
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DOT" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DOT — Digital Organism Theory" />
    <meta
      property="og:description"
      content="Consciousness: A Digital Organism — Book One of Digital Organism Theory, with its models, evidence boundaries, and open questions kept in view."
    />
    <link rel="canonical" href="https://dotheory.org" />
    <meta property="og:site_name" content="DOTHEORY" />
    <meta property="og:url" content="https://dotheory.org" />
    <meta property="og:image" content="https://dotheory.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DOT — Consciousness: A Digital Organism, Book One" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DOT — Digital Organism Theory" />
    <meta
      name="twitter:description"
      content="Read the line-edited Book One, trace every concept to its source, and keep hypotheses and open questions in view."
    />
    <meta name="twitter:image" content="https://dotheory.org/og-image.png" />
  </head>
