<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon-dot.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dot.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DOT — Digital Organism Theory</title>
    <meta
      name="description"
      content="Digital Organism Theory: a new consciousness-first paradigm for reality and human purpose, examined through study, questioning, and lived experience."
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Restore the real URL after 404.html folded it into a query string, so a
         shared or reloaded chapter link lands on the chapter. Must run before
         the app boots and reads the location. -->
    <script>
      (function (l) {
        if (l.search[1] !== "/") return;
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (part) {
            return part.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash,
        );
      })(window.location);
    </script>

    <!-- Every page's own text is written into #root at build time, for readers
         without JavaScript and for crawlers that read HTML without running it
         (scripts/materialize-public-routes.mjs, ADR-0033). A browser that runs
         scripts marks itself here, before first paint, so it never shows that
         copy; the app replaces #root as soon as it starts. -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <style>
      html:not(.js) { color: #142822; background: #f2f0e8; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        html:not(.js) { color: #f2f0e8; background: #0c1715; color-scheme: dark; }
      }
      .js [data-prerender] { display: none; }
      [data-prerender] {
        display: block;
        max-width: 42rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 6rem;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 1.0625rem;
        line-height: 1.65;
      }
      [data-prerender] h1 { font-size: 2rem; line-height: 1.2; margin: 1.5rem 0 1rem; }
      [data-prerender] h2 { font-size: 1.35rem; line-height: 1.25; margin: 2.5rem 0 1rem; }
      [data-prerender] p,
      [data-prerender] ul,
      [data-prerender] ol,
      [data-prerender] blockquote { margin: 0 0 1rem; }
      [data-prerender] ul,
      [data-prerender] ol { padding-left: 1.5rem; list-style: revert; }
      [data-prerender] a { color: inherit; text-decoration: underline; }
      [data-prerender] nav { margin-top: 3rem; font-size: 0.875rem; }
    </style>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f2f0e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DOT" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DOT — Digital Organism Theory" />
    <meta
      property="og:description"
      content="Digital Organism Theory: a new consciousness-first paradigm for reality and human purpose, examined through study, questioning, and lived experience."
    />
    <link rel="canonical" href="https://dotheory.org" />
    <meta property="og:site_name" content="DOTHEORY" />
    <meta property="og:url" content="https://dotheory.org" />
    <meta property="og:image" content="https://dotheory.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DOT Academy — the intellectual home of Digital Organism Theory" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DOT — Digital Organism Theory" />
    <meta
      name="twitter:description"
      content="Digital Organism Theory: a new consciousness-first paradigm for reality and human purpose, examined through study, questioning, and lived experience."
    />
    <meta name="twitter:image" content="https://dotheory.org/og-image.png" />

    <!-- Structured data. A crawler reading only this document cannot run the
         app, so the Academy and its publications have to be stated here.
         scripts/materialize-public-routes.mjs rewrites this block
         per route at build time from the release manifest; the placeholder
         below is what the dev server serves. -->
    <script type="application/ld+json" id="dot-structured-data">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Digital Organism Theory",
        "alternateName": "DOT",
        "url": "https://dotheory.org",
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
