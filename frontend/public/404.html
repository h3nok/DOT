<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOT — Digital Organism Theory</title>
    <meta name="robots" content="noindex" />
    <script>
      // A static host serves this file for any path it has no file for. Every
      // chapter, concept, and citation link is such a path, so instead of
      // showing a dead end we fold the path into a query string and hand
      // control back to index.html, which restores the real URL before React
      // Router reads it. Without this, sharing or reloading a chapter link 404s.
      //
      // 0 when the site is served from a domain root; 1 when it is served from
      // a /<repo>/ subpath (a GitHub Pages project site without a custom
      // domain). Must stay in step with `base` in vite.config.js.
      var SEGMENTS_TO_KEEP = 0;

      (function (l) {
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + SEGMENTS_TO_KEEP)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(SEGMENTS_TO_KEEP)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash,
        );
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>
      <p>
        This page needs JavaScript to reach the reader.
        <a href="/">Return to Digital Organism Theory</a>.
      </p>
    </noscript>
  </body>
</html>
