<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Canonical Sullix orange for light surfaces -->
    <linearGradient id="brandTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="brandBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <!-- Subtle top-edge sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow for lift -->
    <filter id="sh" x="-8%" y="-4%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#sh)">
    <!-- Top chevron -->
    <polygon points="24,104 100,32 176,104 158,104 100,52 42,104" fill="url(#brandTop)"/>
    <polygon points="24,104 100,32 176,104 170,98 100,40 30,98" fill="url(#sheen)" opacity="0.5"/>

    <!-- Bottom chevron -->
    <polygon points="24,146 100,74 176,146 158,146 100,94 42,146" fill="url(#brandBot)"/>
    <polygon points="24,146 100,74 176,146 170,140 100,82 30,140" fill="url(#sheen)" opacity="0.35"/>
  </g>
</svg>
