<title id="reality-stream-title">RF₀ and the Reality Stream</title>
<desc id="reality-stream-desc">Inside one Big C boundary, RF zero contains a living Avatar in a shared world. A downward Reality Stream arrow crosses the RF zero boundary and reaches Little c, which remains within Big C and outside RF zero. A connected Canvas carries the Painting used in interpretation. The frame is labelled lawful environment, the stream situated input, and the Painting accumulated interpretation. The diagram represents DOT’s proposed architecture.</desc>
