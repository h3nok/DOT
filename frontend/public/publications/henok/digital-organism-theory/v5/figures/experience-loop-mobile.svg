<svg xmlns="http://www.w3.org/2000/svg" width="350" height="1200" viewBox="0 0 350 1200" role="img" aria-labelledby="experience-loop-title experience-loop-desc">
<title id="experience-loop-title">One moment changes the next</title>
<desc id="experience-loop-desc">Seven connected steps form the Experience Loop: receive a moment; interpret it through the Painting; notice possible responses; form Intent; act through the body; encounter consequence; and carry change forward in Canvas state. A returning arrow brings the changed state into the next moment.</desc>
<defs>
<marker id="experience-loop-arrow-jade" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#2f715b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="experience-loop-arrow-clay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a6553b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="experience-loop-arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#536b60" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="experience-loop-arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#967022" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
