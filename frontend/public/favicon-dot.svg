<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Outer field ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#8a8a8a" stroke-width="1.35" opacity="0.32"/>
  <!-- Mid ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#555" stroke-width="1.55" opacity="0.5"/>
  <!-- Right arc (bolder) -->
  <path d="M 50 16 C 68 16 84 31 84 50 C 84 69 68 84 50 84" fill="none" stroke="#333" stroke-width="2.25" stroke-linecap="round" opacity="0.85"/>
  <!-- Left arc (lighter) -->
  <path d="M 50 84 C 32 84 16 69 16 50 C 16 31 32 16 50 16" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#333" stroke-width="1.4" opacity="0.36"/>
  <!-- Core dot -->
  <circle cx="50" cy="50" r="7.5" fill="#333"/>
  <!-- Eye -->
  <circle cx="50" cy="50" r="3.25" fill="white" opacity="0.72"/>
</svg>
