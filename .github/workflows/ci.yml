name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.AR_REPO }} # Artifact Registry repo name, e.g. dot-orchestrator
  API_SERVICE: dot-orchestrator-api
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Blocking: the repo is at zero type errors and must stay there.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

  orchestrator:
    name: FastAPI orchestrator quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dot_ci
          POSTGRES_USER: dot
          POSTGRES_PASSWORD: dot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dot -d dot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORCHESTRATOR_DATABASE_URL: postgresql+asyncpg://dot:dot@127.0.0.1:5432/dot_ci
    defaults:
      run:
        working-directory: backend/orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/orchestrator/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check app migrations

      - name: Format check
        run: ruff format --check app migrations

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration drift check
        run: alembic check

      - name: Test
        run: pytest

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend dependency audit
        working-directory: frontend
        run: pnpm audit --audit-level high

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/orchestrator/requirements.txt

  deploy:
    name: Deploy orchestrator to Cloud Run
    needs: [frontend, orchestrator, security]
    # Only deploy from main; skip on PRs.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Workload Identity Federation — no long-lived service account keys in secrets.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend/orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/orchestrator:${{ github.sha }}
          docker build -f Dockerfile -t "$IMAGE" ../..
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Run migrations via Cloud Run job
        run: |
          gcloud run jobs deploy dot-migrate \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --service-account ${{ env.RUNTIME_SERVICE_ACCOUNT }} \
            --set-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --set-secrets ORCHESTRATOR_DATABASE_URL=ORCHESTRATOR_DATABASE_URL:latest \
            --command python3 \
            --args=-m,alembic,upgrade,head \
            --max-retries 1 \
            --task-timeout 120s \
            --quiet \
            --project ${{ env.GCP_PROJECT_ID }}
          gcloud run jobs execute dot-migrate \
            --region ${{ env.GCP_REGION }} \
            --wait \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Ingest released Book One canon
        run: |
          gcloud run jobs deploy dot-ingest-canon \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --service-account ${{ env.RUNTIME_SERVICE_ACCOUNT }} \
            --set-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --set-secrets \
              ORCHESTRATOR_DATABASE_URL=ORCHESTRATOR_DATABASE_URL:latest,\
              ORCHESTRATOR_TWIN_API_KEY=ORCHESTRATOR_TWIN_API_KEY:latest \
            --command python3 \
            --args=scripts/ingest_canon.py,--owner,henok \
            --max-retries 1 \
            --task-timeout 600s \
            --quiet \
            --project ${{ env.GCP_PROJECT_ID }}
          gcloud run jobs execute dot-ingest-canon \
            --region ${{ env.GCP_REGION }} \
            --wait \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${{ env.API_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --service-account ${{ env.RUNTIME_SERVICE_ACCOUNT }} \
            --set-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --set-secrets \
              ORCHESTRATOR_DATABASE_URL=ORCHESTRATOR_DATABASE_URL:latest,\
              ORCHESTRATOR_SERVICE_AUTH_SECRET=ORCHESTRATOR_SERVICE_AUTH_SECRET:latest,\
              ORCHESTRATOR_CORS_ORIGINS=ORCHESTRATOR_CORS_ORIGINS:latest,\
              ORCHESTRATOR_TWIN_API_KEY=ORCHESTRATOR_TWIN_API_KEY:latest \
            --set-env-vars \
              ORCHESTRATOR_ENVIRONMENT=production,\
              ORCHESTRATOR_AUTH_MODE=jwt,\
              ORCHESTRATOR_AUTH_ENABLED=true,\
              ORCHESTRATOR_FRONTEND_URL=https://dotheory.org,\
              ORCHESTRATOR_TWIN_MODEL=gemini-3.5-flash-lite,\
              ORCHESTRATOR_REDIS_URL=memory://,\
              ORCHESTRATOR_OBJECT_STORE_BACKEND=filesystem,\
              ORCHESTRATOR_LOCAL_OBJECT_STORE_ROOT=/tmp/dot-objects \
            --quiet \
            --project ${{ env.GCP_PROJECT_ID }}

  smoke:
    name: Post-deploy smoke test
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get API URL
        id: api_url
        run: |
          URL=$(gcloud run services describe ${{ env.API_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format "value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ steps.api_url.outputs.url }}/health/ready")
          [ "$STATUS" = "200" ] || (echo "Health check failed: $STATUS" && exit 1)

      - name: Sitemap check
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ steps.api_url.outputs.url }}/v1/publications/sitemap.xml")
          [ "$STATUS" = "200" ] || (echo "Sitemap check failed: $STATUS" && exit 1)

      - name: Cache-Control header check
        run: |
          HEADERS=$(curl -sI "${{ steps.api_url.outputs.url }}/v1/publications/sitemap.xml")
          echo "$HEADERS" | grep -i "cache-control" || (echo "Missing Cache-Control header" && exit 1)

      - name: Grounded companion check
        run: |
          curl -sf "${{ steps.api_url.outputs.url }}/v1/twin/public/ask" \
            -H "Content-Type: application/json" \
            -d '{"owner_id":"henok","lens":"ground","question":"What is the Limit of Knowledge?"}' \
            | jq -e '.grounded == true and (.citations | length > 0)'
