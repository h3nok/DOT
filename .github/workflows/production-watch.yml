name: Production watch

# Looks at the live site and API the way a visitor's browser does, every half
# hour. When a check fails, the run opens (or updates) one issue assigned to
# the repository owner, and closes it once production recovers. Assignment is
# the alert: it does not depend on who last edited this schedule. Nothing is
# sent to readers, and no third-party monitor sees the site (L4, L9).
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-watch
  cancel-in-progress: false

env:
  SITE: https://dotheory.org
  API: ${{ vars.VITE_ORCHESTRATOR_URL }}
  ALERT_LABEL: production-watch

jobs:
  watch:
    name: Site and API answer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Public pages carry their own text
        run: |
          set -euo pipefail
          fetch() { curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 "$1"; }
          for path in / /about/ /blog/ /contact/ /book/digital-organism-theory/preface/; do
            body=$(fetch "$SITE$path")
            grep -q '<div id="root">' <<<"$body" || { echo "::error::$path did not return the application shell"; exit 1; }
            echo "ok $path"
          done
          # About's own script-free text, not merely some prerendered page (ADR-0033).
          fetch "$SITE/about/" | grep -q 'id="about-products"' || { echo "::error::/about lost its prerendered text"; exit 1; }
          fetch "$SITE/feed.xml" | grep -q '<rss' || { echo "::error::the RSS feed is not served"; exit 1; }

      - name: API is healthy and its public doors are open
        run: |
          set -euo pipefail
          # This watch exists to check the API; a missing URL is itself a failure.
          if [[ -z "$API" ]]; then
            echo "::error::The VITE_ORCHESTRATOR_URL repository variable is not set."
            exit 1
          fi
          fetch() { curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 "$@"; }
          fetch "$API/health" >/dev/null
          echo "ok /health"
          # These say available:false when their configuration is missing, which
          # a 200 alone would hide: contact, the reader list and the book.
          for path in /v1/contact/status /v1/readers/status; do
            fetch "$API$path" | jq -e '.available == true' >/dev/null || { echo "::error::$path is not available"; exit 1; }
            echo "ok $path"
          done
          fetch "$API/v1/commerce/products/book-one-pdf" | jq -e '.available == true' >/dev/null || { echo "::error::the Book One PDF is not available"; exit 1; }
          echo "ok book-one-pdf"
          # Browsers must be allowed to call the API from the site.
          allowed=$(fetch -o /dev/null -D - -X OPTIONS "$API/v1/contact/messages" \
            -H "Origin: $SITE" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
          [[ "$allowed" == "$SITE" ]] || { echo "::error::CORS no longer allows $SITE (got '$allowed')"; exit 1; }
          echo "ok CORS"

      - name: Alert the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh label create "$ALERT_LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Opened and closed by the production watch" --force >/dev/null
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$open" ]]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" --assignee "$OWNER" \
              --title "Production watch: dotheory.org check failing" \
              --body "A scheduled check of the live site or API failed: $RUN_URL. This issue closes itself when a later run passes."
          fi

      - name: Close the alert once production recovers
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [[ -n "$open" ]]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $RUN_URL"
          fi
