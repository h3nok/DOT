name: Production watch

# Looks at the live site and API the way a visitor's browser does, every half
# hour. A failed run is the alert: GitHub emails the repository owner about
# failed scheduled workflows. Nothing is sent to readers, and no third-party
# monitor sees the site (L4, L9).
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-watch
  cancel-in-progress: false

env:
  SITE: https://dotheory.org
  API: ${{ vars.VITE_ORCHESTRATOR_URL }}

jobs:
  watch:
    name: Site and API answer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Public pages carry their own text
        run: |
          set -euo pipefail
          fetch() { curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 "$1"; }
          for path in / /about/ /blog/ /contact/ /book/digital-organism-theory/preface/; do
            body=$(fetch "$SITE$path")
            grep -q '<div id="root">' <<<"$body" || { echo "::error::$path did not return the application shell"; exit 1; }
            echo "ok $path"
          done
          # Script-free text exists on the pages a visitor or crawler lands on (ADR-0033).
          fetch "$SITE/about/" | grep -q '<article data-prerender>' || { echo "::error::/about lost its prerendered text"; exit 1; }
          fetch "$SITE/feed.xml" | grep -q '<rss' || { echo "::error::the RSS feed is not served"; exit 1; }

      - name: API is healthy and its public doors are open
        run: |
          set -euo pipefail
          if [[ -z "$API" ]]; then
            echo "::notice::No orchestrator URL configured; nothing to check."
            exit 0
          fi
          fetch() { curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 "$1"; }
          fetch "$API/health" >/dev/null
          echo "ok /health"
          # These say available:false when their configuration is missing, which
          # a 200 alone would hide: contact, the reader list and the book.
          for path in /v1/contact/status /v1/readers/status; do
            fetch "$API$path" | jq -e '.available == true' >/dev/null || { echo "::error::$path is not available"; exit 1; }
            echo "ok $path"
          done
          fetch "$API/v1/commerce/products/book-one-pdf" | jq -e '.available == true' >/dev/null || { echo "::error::the Book One PDF is not available"; exit 1; }
          echo "ok book-one-pdf"
          # Browsers must be allowed to call the API from the site.
          allowed=$(curl -fsS -o /dev/null -D - -X OPTIONS "$API/v1/contact/messages" \
            -H "Origin: $SITE" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
          [[ "$allowed" == "$SITE" ]] || { echo "::error::CORS no longer allows $SITE (got '$allowed')"; exit 1; }
          echo "ok CORS"
