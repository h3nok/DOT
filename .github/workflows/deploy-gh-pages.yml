name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.4.1
        
    - name: Install dependencies
      run: |
        cd frontend
        pnpm install --frozen-lockfile
        
    - name: Build
      env:
        VITE_ORCHESTRATOR_URL: ${{ vars.VITE_ORCHESTRATOR_URL }}
        VITE_ORCHESTRATOR_OWNER_ID: henok
        VITE_PROFILE_DELIVERY_OWNER_ID: henok
        VITE_PROFILE_DELIVERY_SLUG: henok-profile
        VITE_SITE_URL: https://henokghebrechristos.com
      run: |
        if [[ ! "$VITE_ORCHESTRATOR_URL" =~ ^https:// ]]; then
          echo "VITE_ORCHESTRATOR_URL must be configured as an HTTPS repository variable."
          exit 1
        fi
        cd frontend
        pnpm build
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './frontend/dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
