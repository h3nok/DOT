name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.4.1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml
        
    - name: Install dependencies
      run: |
        cd frontend
        pnpm install --frozen-lockfile

    - name: Install book release tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends pandoc libreoffice-writer

    - name: Release Book One from the Word manuscript
      run: make release-book

    - name: Verify release frontend
      working-directory: frontend
      run: |
        pnpm lint
        pnpm typecheck
        pnpm exec vitest run
        
    - name: Build
      env:
        VITE_ORCHESTRATOR_URL: ${{ vars.VITE_ORCHESTRATOR_URL }}
        VITE_SUPPORT_PAYMENT_LINK: ${{ vars.VITE_SUPPORT_PAYMENT_LINK }}
        VITE_JOIN_URL: ${{ vars.VITE_JOIN_URL }}
        VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
        VITE_PLAUSIBLE_SRC: ${{ vars.VITE_PLAUSIBLE_SRC }}
        VITE_ORCHESTRATOR_OWNER_ID: henok
        VITE_PROFILE_DELIVERY_OWNER_ID: henok
        VITE_PROFILE_DELIVERY_SLUG: henok-profile
        VITE_SITE_URL: https://dotheory.org
      run: |
        # The official public release always measures aggregate readership.
        # Forks remain unmeasured unless their steward deliberately configures
        # a domain of their own (ADR-0024).
        if [[ -z "$VITE_PLAUSIBLE_DOMAIN" && "$GITHUB_REPOSITORY" == "h3nok/DOT" ]]; then
          export VITE_PLAUSIBLE_DOMAIN=dotheory.org
        fi
        # An orchestrator is optional: the canon, the concept map and the seams
        # register are static, so the reading surfaces ship without a backend.
        # What is not optional is that any backend we do name is HTTPS — the
        # session cookie and the support plane both ride on it.
        if [[ -z "$VITE_ORCHESTRATOR_URL" ]]; then
          echo "::notice::No VITE_ORCHESTRATOR_URL set — building a static release. Minty, invites and the circle will be unavailable."
        elif [[ ! "$VITE_ORCHESTRATOR_URL" =~ ^https:// ]]; then
          echo "::error::VITE_ORCHESTRATOR_URL is set but is not HTTPS. Fix the repository variable or unset it for a static release."
          exit 1
        fi
        # The payment link sends a visitor to a page that asks for card details,
        # so a misconfigured one must fail the build rather than downgrade it.
        if [[ -n "$VITE_SUPPORT_PAYMENT_LINK" && ! "$VITE_SUPPORT_PAYMENT_LINK" =~ ^https:// ]]; then
          echo "::error::VITE_SUPPORT_PAYMENT_LINK must be an HTTPS URL."
          exit 1
        fi
        if [[ -n "$VITE_JOIN_URL" && ! "$VITE_JOIN_URL" =~ ^https:// && ! "$VITE_JOIN_URL" =~ ^mailto: ]]; then
          echo "::error::VITE_JOIN_URL must be an HTTPS or mailto URL."
          exit 1
        fi
        # Plausible is bound to a bare hostname, not a URL. A pasted
        # "https://dotheory.org" silently counts nothing, which is the one
        # failure mode a measurement tool must never have (ADR-0024).
        if [[ -n "$VITE_PLAUSIBLE_DOMAIN" && ! "$VITE_PLAUSIBLE_DOMAIN" =~ ^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$ ]]; then
          echo "::error::VITE_PLAUSIBLE_DOMAIN must be a bare hostname such as dotheory.org — no scheme, no path."
          exit 1
        fi
        if [[ -n "$VITE_PLAUSIBLE_SRC" && ! "$VITE_PLAUSIBLE_SRC" =~ ^https:// ]]; then
          echo "::error::VITE_PLAUSIBLE_SRC must be an HTTPS URL."
          exit 1
        fi
        if [[ -z "$VITE_PLAUSIBLE_DOMAIN" ]]; then
          echo "::notice::No VITE_PLAUSIBLE_DOMAIN set — this release counts no readers."
        fi
        if [[ -z "$VITE_SUPPORT_PAYMENT_LINK" && -z "$VITE_ORCHESTRATOR_URL" ]]; then
          echo "::warning::Neither a payment link nor an orchestrator is configured — this release has no way to accept support."
        fi
        cd frontend
        pnpm build

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Verify public route entry points
      run: |
        test -f frontend/dist/book/digital-organism-theory/preface/index.html
        test -f frontend/dist/doctrine/subjective-data/index.html
        test -f frontend/dist/join/index.html
        test -f frontend/dist/support/index.html
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './frontend/dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
